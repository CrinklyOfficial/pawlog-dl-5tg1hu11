<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pawlog">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Pawlog</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand" id="brand"></div>
      <nav id="nav"></nav>
      <div class="side-foot">
        <div class="who" id="who" data-nav="settings" role="button" tabindex="0" title="Account & settings"></div>
        <button class="collapse" id="gear" data-nav="settings" aria-label="Settings" title="Settings"></button>
        <button id="collapse" class="collapse" data-act="collapse" aria-label="Collapse sidebar"></button>
      </div>
    </aside>
    <main>
      <header class="top"><div><h1 id="title"></h1><p id="greet" class="muted"></p></div><div id="petchip" class="petchip" hidden></div></header>
      <section id="view"></section>
    </main>
    <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
  </div>
  <div id="modal" class="overlay" hidden></div>
  <div id="gate" class="gate" hidden></div>
  <script src="web.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="cloud.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
